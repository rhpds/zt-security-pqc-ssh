project:
  slug: "zt-security-pqc-ssh"
  owner_email: "jloscar@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "Hands-On Post-Quantum Cryptography (PQC) with RHEL 10 OpenSSH  In this hands-on lab, participants will explore the transition from classical encryption to quantum-resistant security using Red Hat Enterprise Linux 10. Designed for beginners with no prior post-quantum background, the lab demystifies the \"Harvest Now, Decrypt Later\" (HNDL) threat model and explains how Post-Quantum Cryptography (PQC) protects sensitive enterprise communications.  Through a series of step-by-step practical exercises, learners will inspect a standard, classical SSH session, configure system-wide cryptographic policies to enforce hybrid quantum-resistant key exchanges (ML-KEM), and generate next-generation hybrid authentication keys (ML-DSA). By inspecting raw SSH handshake logs (-vv), participants will directly observe how RHEL 10 seamlessly upgrades session security and user identity verification without breaking existing workflows.  Learning Objectives Understand the core concepts of quantum computing threats (HNDL) and PQC in plain terms.  Inspect classical vs. post-quantum key exchange algorithms during active OpenSSH sessions.  Enforce hybrid post-quantum key exchange mechanisms in sshd.  Generate, deploy, and authenticate using post-quantum SSH key pairs on RHEL 10."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1631"
  workflow_id: "973bbbcc-e6b7-4d6a-bfd4-2a39ebf0fdfb"

spec:
  title: "Getting Started with Post-Quantum Cryptography in RHEL 10 OpenSSH"
  learning_objectives:
  - "Configure system-wide crypto policies to enforce hybrid post-quantum (ML-KEM) key exchange for OpenSSH on RHEL 10."
  - "Observe the difference between classical and post-quantum key exchange by inspecting raw SSH handshake logs (ssh -vv)."
  - "Create and authenticate with a hybrid post-quantum (ML-DSA) SSH key pair on RHEL 10."
  modules:                 # [{id, title, duration_min}] — id is stable (e.g. module-01)
  - id: module-01
    title: "Inspect a Classical SSH Session"
    duration_min: 8
    status: not_started
  - id: module-02
    title: "Enforce Hybrid Post-Quantum Key Exchange (ML-KEM)"
    duration_min: 12
    status: not_started
  - id: module-03
    title: "Create and Use Post-Quantum Authentication Keys (ML-DSA)"
    duration_min: 10
    status: not_started
