---
- name: Register both VMs for SSH lab setup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    setup_bastion_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
    setup_bastion_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') | default('22', true) }}"
    setup_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
    setup_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
  tasks:
    - name: Require the provisioned SSH connection settings
      ansible.builtin.assert:
        that:
          - setup_bastion_host | length > 0
          - setup_bastion_port | int > 0
          - setup_user | length > 0
          - setup_password | length > 0
      no_log: true

    - name: Add the learner bastion and the node1 CNV service
      ansible.builtin.add_host:
        name: "{{ item.vm }}"
        groups: ssh_lab_setup
        ansible_host: "{{ item.endpoint }}"
        ansible_port: "{{ item.port | int }}"
        ansible_user: "{{ setup_user }}"
        ansible_password: "{{ setup_password }}"
        ansible_become_password: "{{ setup_password }}"
        # The Showroom image can supply a shared ControlPath. Never reuse one
        # SSH transport across the two VM setup targets.
        ansible_ssh_args: '-o ControlMaster=no -o ControlPath=none -o ControlPersist=no'
        ansible_pipelining: true
      loop:
        - {vm: node1, endpoint: node1, port: 22}
        - {vm: rhel, endpoint: "{{ setup_bastion_host }}", port: "{{ setup_bastion_port }}"}
      no_log: true

- name: Apply each VM's setup script
  hosts: ssh_lab_setup
  gather_facts: false
  any_errors_fatal: true
  order: inventory
  serial: 1
  tasks:
    - name: Wait for both provisioned systems to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Identify the connected VM before making changes
      ansible.builtin.command: hostname -s
      register: setup_hostname
      changed_when: false

    - name: Require each endpoint to reach the intended VM
      ansible.builtin.assert:
        that: setup_hostname.stdout | trim == inventory_hostname
        fail_msg: "Setup endpoint for {{ inventory_hostname }} reached {{ setup_hostname.stdout | trim }} instead."

    - name: Install the learner SSH configuration and keys
      ansible.builtin.command:
        argv: [timeout, '30', /bin/bash, -s]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/setup-' ~ inventory_hostname ~ '.sh') }}"
        expand_argument_vars: false
      become: true
      no_log: true
      environment:
        GUID: "{{ lookup('ansible.builtin.env', 'GUID') }}"
        DOMAIN: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
        NODE1_IP: "{{ lookup('ansible.builtin.env', 'NODE1_IP') }}"

    - name: Verify the learner can access node1 noninteractively from rhel
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, ConnectTimeout=8, node1, "hostname -s && sudo -n /usr/sbin/sshd -t"]
      register: setup_node1_ssh
      changed_when: false
      failed_when: setup_node1_ssh.rc != 0 or setup_node1_ssh.stdout | trim != 'node1'
      when: inventory_hostname == 'rhel'
