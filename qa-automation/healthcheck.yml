---
- ansible.builtin.import_playbook: inventory.yml

- name: "SSH readiness from the learner bastion"
  hosts: qa_bastions
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Confirm RHEL 10 on the bastion"
      ansible.builtin.command:
        argv: ["rpm", "-E", "%{rhel}"]
      register: rhel_release
      changed_when: false
    - name: "Read the starting crypto policy"
      ansible.builtin.command:
        argv: ["update-crypto-policies", "--show"]
      register: policy
      changed_when: false
    - name: "List available OpenSSH algorithms"
      ansible.builtin.command:
        argv: ["ssh", "-Q", "kex"]
      register: algorithms
      changed_when: false
    - name: "Confirm the learner can reach and administer a distinct node1"
      ansible.builtin.command:
        argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "node1", "hostname -s && sudo -n /usr/sbin/sshd -t"]
      register: node
      changed_when: false
    - name: "Assert the expected environment"
      ansible.builtin.assert:
        that:
          - "rhel_release.stdout | trim == '10'"
          - "policy.stdout | trim == 'DEFAULT'"
          - "'mlkem768x25519-sha256' in algorithms.stdout_lines"
          - "node.stdout | trim == 'node1'"
