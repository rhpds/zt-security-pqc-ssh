---
- ansible.builtin.import_playbook: inventory.yml

- name: "SSH readiness from the learner bastion"
  hosts: qa_bastions
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Confirm RHEL 10 on the bastion"
      ansible.builtin.command:
        argv: ["rpm", "-E", "%{rhel}"]
      register: rhel_release
      changed_when: false
    - name: "Read the starting crypto policy"
      ansible.builtin.command:
        argv: ["update-crypto-policies", "--show"]
      register: policy
      changed_when: false
    - name: "List available OpenSSH algorithms"
      ansible.builtin.command:
        argv: ["ssh", "-Q", "kex"]
      register: algorithms
      changed_when: false
    - name: Read effective client KEX preferences as in Module 2
      ansible.builtin.command:
        argv: [ssh, -G, localhost]
      register: effective_client
      changed_when: false
    # CNV guests cloned from the same template may share /etc/machine-id.
    - name: Read the bastion VM hardware UUID
      ansible.builtin.command: sudo -n cat /sys/class/dmi/id/product_uuid
      register: bastion_id
      changed_when: false
    - name: Confirm the learner can reach and administer node1
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, ConnectTimeout=8, node1, "hostname -s && sudo -n cat /sys/class/dmi/id/product_uuid && sudo -n /usr/sbin/sshd -t"]
      register: node
      changed_when: false
    - name: "Assert the expected environment"
      ansible.builtin.assert:
        that:
          - "rhel_release.stdout | trim == '10'"
          - "policy.stdout | trim == 'DEFAULT'"
          - "'mlkem768x25519-sha256' in algorithms.stdout_lines"
          - effective_client.stdout is search('(?im)^kexalgorithms[ \t]+mlkem768x25519-sha256(?:,|$)')
          - node.stdout_lines | length == 2
          - node.stdout_lines[0] == 'node1'
          - bastion_id.stdout is match('(?i)^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
          - node.stdout_lines[1] is match('(?i)^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
          - bastion_id.stdout != '00000000-0000-0000-0000-000000000000'
          - node.stdout_lines[1] != '00000000-0000-0000-0000-000000000000'
          - node.stdout_lines[1] | lower != bastion_id.stdout | lower
        fail_msg: Lab baseline check failed. Confirm ML-KEM is preferred and node1 is a separate VM.
