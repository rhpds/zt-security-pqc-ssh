---
# HEALTHCHECK — Quick environment readiness check
# Runs post-provisioning to verify the lab environment is functional.
# Completes in under 60 seconds.
#
# Checks (on both RHEL 10 lab hosts — rhel bastion and node1):
#   - host is reachable
#   - openssh-server is installed and sshd is running
#   - the lab user account exists
#   - the system-wide crypto policy is DEFAULT, which on RHEL 10.1+ already
#     includes post-quantum (ML-KEM) key exchange — this lab's starting state
#
# Exit 0 = healthy, non-zero = unhealthy.
#
# Tunables:
#   hc_ssh_user                : lab user provisioned by setup-automation/
#   hc_expected_crypto_policy  : policy learners start from
#
# Inventory: this QA playbook runs in the runner's "standalone" mode, which
# supplies no external inventory — it builds its own below, same as
# setup-automation/main.yml and runtime-automation/main.yml do.

- name: "Build inventory from the running environment"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Register rhel (bastion) and node1"
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: "{{ item.group }}"
        ansible_host: "{{ item.name }}"
        ansible_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_USER') }}"
        ansible_password: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PASSWORD') }}"
      loop:
        - { name: rhel, group: bastions }
        - { name: node1, group: nodes }

- name: "Environment Health Check"
  hosts: bastions:nodes
  gather_facts: false
  vars:
    hc_ssh_user: rhel
    hc_expected_crypto_policy: DEFAULT
  tasks:
    - name: "Host is reachable"
      ansible.builtin.ping:

    - name: "OpenSSH server package is installed"
      ansible.builtin.command: rpm -q openssh-server
      register: hc_openssh
      changed_when: false
      failed_when: hc_openssh.rc != 0

    - name: "sshd service is running"
      ansible.builtin.service_facts:

    - name: "Assert sshd is running"
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - ansible_facts.services['sshd.service'].state == 'running'
        success_msg: "sshd is running."
        fail_msg: "sshd is not running — learners cannot connect."

    - name: "Lab user account exists"
      ansible.builtin.command: "id {{ hc_ssh_user }}"
      register: hc_user
      changed_when: false
      failed_when: hc_user.rc != 0

    - name: "Read the system-wide crypto policy"
      ansible.builtin.command: update-crypto-policies --show
      register: hc_crypto_policy
      changed_when: false

    - name: "Assert the crypto policy is the lab's starting policy"
      ansible.builtin.assert:
        that:
          - hc_crypto_policy.stdout | trim == hc_expected_crypto_policy
        success_msg: "Crypto policy is '{{ hc_expected_crypto_policy }}', which already includes post-quantum key exchange on RHEL 10.1+."
        fail_msg: >-
          Crypto policy is '{{ hc_crypto_policy.stdout | trim }}', expected
          '{{ hc_expected_crypto_policy }}'. Learners must start from this
          policy for modules 2-3 to observe the expected post-quantum state.
