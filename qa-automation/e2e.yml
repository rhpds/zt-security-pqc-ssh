---
- ansible.builtin.import_playbook: healthcheck.yml

- name: "Verify learner SSH negotiation before and after requiring PQC"
  hosts: qa_bastions
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Modules 1–3: observe the default handshake"
      ansible.builtin.command:
        argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "-v", "node1", "hostname -s"]
      register: baseline
      changed_when: false
    - name: "Module 3: confirm classical-only negotiation initially works"
      ansible.builtin.command:
        argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "-v", "-o", "KexAlgorithms=curve25519-sha256", "node1", "hostname -s"]
      register: classical
      changed_when: false
    - name: "Assert both baseline handshakes reached node1"
      ansible.builtin.assert:
        that:
          - "baseline.stdout | trim == 'node1'"
          - "classical.stdout | trim == 'node1'"
          - "'kex: algorithm: mlkem768x25519-sha256' in baseline.stderr"
          - "'kex: algorithm: curve25519-sha256' in classical.stderr"
    - name: "Do not overwrite an existing learner drop-in"
      ansible.builtin.command:
        argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "node1", "sudo -n test ! -e /etc/ssh/sshd_config.d/01-pqc-required.conf && sudo -n test ! -L /etc/ssh/sshd_config.d/01-pqc-required.conf"]
      changed_when: false
    - name: Arm rollback on node1 before touching sshd
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=8
          - node1
          - >-
            sudo -n systemd-run --unit=lb2081-qa-sshd-rollback --on-active=3m
            /bin/sh -c 'rm -f /etc/ssh/sshd_config.d/01-pqc-required.conf
            && /usr/sbin/sshd -t && systemctl reload sshd'

    - name: Exercise module 4 and restore the original SSH policy
      block:
        - name: "Install and validate the lab drop-in on node1"
          ansible.builtin.command:
            argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "node1", "printf '%s\\n' 'KexAlgorithms mlkem768x25519-sha256' | sudo -n tee /etc/ssh/sshd_config.d/01-pqc-required.conf >/dev/null && sudo -n /usr/sbin/sshd -t && sudo -n systemctl reload sshd"]
        - name: "Confirm the normal post-quantum connection still succeeds"
          ansible.builtin.command:
            argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "-v", "node1", "hostname -s"]
          register: hardened
          changed_when: false
        - name: "Confirm the classical-only connection is rejected"
          ansible.builtin.command:
            argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "-v", "-o", "KexAlgorithms=curve25519-sha256", "node1", "hostname -s"]
          register: rejected
          changed_when: false
          failed_when: false
        - name: "Require a key-exchange failure, not a network or auth failure"
          ansible.builtin.assert:
            that:
              - "hardened.stdout | trim == 'node1'"
              - "'kex: algorithm: mlkem768x25519-sha256' in hardened.stderr"
              - "rejected.rc == 255"
              - "'no matching key exchange method found' in rejected.stderr"
      always:
        - name: "Remove the QA drop-in, validate sshd, and reload"
          ansible.builtin.command:
            argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "node1", "sudo -n rm -f /etc/ssh/sshd_config.d/01-pqc-required.conf && sudo -n /usr/sbin/sshd -t && sudo -n systemctl reload sshd && sudo -n systemctl stop lb2081-qa-sshd-rollback.timer"]
    - name: "Verify classical connectivity was restored"
      ansible.builtin.command:
        argv: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "-v", "-o", "KexAlgorithms=curve25519-sha256", "node1", "hostname -s"]
      register: restored
      changed_when: false
    - name: "Confirm the restored connection reached node1"
      ansible.builtin.assert:
        that:
          - "restored.stdout | trim == 'node1'"
